<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SkyLedger Settings</title>
    <link rel="stylesheet" href="/assets/app.css?v=marker-settings-1">
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar page-topbar">
        <a class="brand" href="/">
          <span class="brand-mark"></span>
          <span>
            <strong>SkyLedger</strong>
            <small>Settings</small>
          </span>
        </a>
        <nav class="nav-actions">
          <a href="/">Dashboard</a>
          <a href="/history">History</a>
        </nav>
      </header>
      <section class="settings-grid">
        <article class="settings-panel">
          <span class="eyebrow">Receiver</span>
          <dl id="statusList"></dl>
        </article>
        <article class="settings-panel">
          <span class="eyebrow">Configuration</span>
          <dl id="configList"></dl>
        </article>
        <article class="settings-panel actions-panel">
          <span class="eyebrow">Home</span>
          <label class="field-label" for="homeNameInput">Home Name</label>
          <input id="homeNameInput" type="text" maxlength="80" autocomplete="off" required>
          <div class="coordinate-fields">
            <label class="field-label" for="homeLatInput">
              Latitude
              <input id="homeLatInput" type="number" min="-90" max="90" step="0.000001" required>
            </label>
            <label class="field-label" for="homeLonInput">
              Longitude
              <input id="homeLonInput" type="number" min="-180" max="180" step="0.000001" required>
            </label>
          </div>
          <button id="saveHomeSettings" type="button">Save Home</button>
          <p id="homeSettingsResult"></p>
        </article>
        <article class="settings-panel actions-panel">
          <span class="eyebrow">Map</span>
          <label class="field-label" for="mapZoomRange">Map Zoom</label>
          <div class="zoom-control">
            <input id="mapZoomRange" type="range" min="0" max="19" step="1">
            <input id="mapZoomNumber" type="number" min="0" max="19" step="1">
          </div>
          <button id="saveMapZoom" type="button">Save Map Zoom</button>
          <p id="settingsResult"></p>
        </article>
        <article class="settings-panel actions-panel">
          <span class="eyebrow">Aircraft Markers</span>
          <div class="color-fields">
            <label class="field-label color-field" for="lowMarkerColorInput">
              Low / alert altitude
              <input id="lowMarkerColorInput" type="color">
            </label>
            <label class="field-label color-field" for="defaultMarkerColorInput">
              Standard aircraft
              <input id="defaultMarkerColorInput" type="color">
            </label>
          </div>
          <button id="saveMarkerColors" type="button">Save Marker Colors</button>
          <p id="markerColorsResult"></p>
        </article>
        <article class="settings-panel actions-panel">
          <span class="eyebrow">Tests</span>
          <button id="testCountdown" type="button">Test Countdown</button>
          <button id="testDiscord" type="button">Test Discord</button>
          <button id="clearHistory" class="danger-button" type="button">Clear History</button>
          <p id="testResult"></p>
        </article>
      </section>
    </main>
    <script src="/assets/settings.js?v=marker-settings-1"></script>
  </body>
</html>
